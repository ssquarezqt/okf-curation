[project]
name = "okf-curation"
version = "1.0.0"
description = "Curación de repos, Jira y Confluence en un repo OKF para agentes de código"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "anthropic>=0.70",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.scripts]
okf = "okf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okf"]
